name: deploy emscripten
on:
  push:
    branches: [main]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: emscripten-core/setup-emsdk@v16

      - name: verify
        run: emcc -v

      - name: setup
        run: emcmake cmake --preset web

      - name: build
        run: cmake --build build-web

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-web/bin/

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build-web/bin/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: 
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
      
        
        
  
